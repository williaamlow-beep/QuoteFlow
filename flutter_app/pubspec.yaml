name: quoteflow_mobile
description: A clean modular Flutter application for local-first trade quoting, invoicing, photo annotations, PDF exports, and WhatsApp sharing.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Persistence & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.1.0

  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.12.0

  # WhatsApp & URL Launcher
  url_launcher: ^6.2.4

  # Utilities & UUID
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/seed_templates.json
